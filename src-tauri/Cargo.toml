[package]
name = "pogo-control-hub"
version = "0.1.0"
description = "Windows desktop control hub for a USB-connected iPad/iPhone location-testing dashboard"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pogo_control_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
log = "0.4"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }

# Pure-Rust reimplementation of libimobiledevice's protocols (usbmuxd,
# lockdown, pairing, DVT location simulation, mobile image mounter). Chosen
# over rusty_libimobiledevice (FFI bindings to the C library) because it has
# no native C library to install/link on Windows - everything it needs is a
# normal Cargo dependency, which matters for producing a distributable .exe.
# It is explicitly a pre-1.0 "research stage" project (used in production by
# StikDebug/CrossCode) with breaking changes between point releases, so the
# version below is pinned deliberately - bump it consciously, not via a
# routine `cargo update`.
idevice = { version = "=0.1.65", default-features = false, features = [
    "aws-lc",
    "usbmuxd",
    "pair",
    "location_simulation",
    "mobile_image_mounter",
    # iOS 17+ location simulation moved behind the CoreDeviceProxy tunnel:
    # `com.apple.dt.simulatelocation` is no longer reachable via classic
    # lockdown StartService (returns InvalidService) on iOS 17+. The real
    # path is CoreDeviceProxy -> software TCP/IP tunnel -> RSD discovery ->
    # DVT RemoteServer -> LocationSimulation channel. See
    # src-tauri/src/location/modern.rs and docs/LOCATION_PROVIDERS.md.
    "core_device_proxy",
    "core_device",
    "dvt",
    "rsd",
    "tunnel_tcp_stack",
] }
plist = "1.8"

